<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TryWise Clipper</title>
  <style>
    body { width: 320px; margin: 0; padding: 12px; font-family: system-ui, sans-serif; color: #172033; }
    label { display: grid; gap: 4px; margin-bottom: 8px; font-size: 12px; color: #667085; font-weight: 700; }
    input, textarea { width: 100%; box-sizing: border-box; border: 1px solid #d9e0ea; border-radius: 7px; padding: 8px; font: inherit; color: #172033; }
    textarea { min-height: 72px; resize: vertical; }
    button { width: 100%; border: 0; border-radius: 7px; padding: 9px; background: #176b87; color: #fff; font-weight: 800; cursor: pointer; }
    h1 { font-size: 16px; margin: 0 0 10px; }
    #status { margin-top: 8px; color: #667085; font-size: 12px; }
  </style>
</head>
<body>
  <h1>Save trial candidate</h1>
  <label>
    Name
    <input id="title" type="text">
  </label>
  <label>
    Notes
    <textarea id="notes" placeholder="Why this trial looks useful"></textarea>
  </label>
  <button id="saveBtn" type="button">Save locally</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
