name: Weekly trial candidate collection
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: weekly-collector
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collectors
        run: python3 -m unittest discover -s backend -p 'test_*.py'
      - name: Find previous state from this trusted workflow
        id: previous
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.actions.listArtifactsForRepo({
              ...context.repo, name: 'weekly-collector-state', per_page: 100
            });
            for (const artifact of data.artifacts) {
              if (artifact.expired || artifact.workflow_run?.head_branch !== 'main') continue;
              const {data: run} = await github.rest.actions.getWorkflowRun({
                ...context.repo, run_id: artifact.workflow_run.id
              });
              if (run.path !== '.github/workflows/collect.yml') continue;
              core.setOutput('run_id', String(run.id));
              break;
            }
      - name: Restore collector state (never a repository commit)
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: weekly-collector-state
          path: backend/data/weekly
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Collect unreviewed candidates
        run: python3 backend/collector.py --data-dir backend/data/weekly --quiet --require-success
        env:
          TRYWISE_CONTACT: ${{ secrets.TRYWISE_CONTACT }}
      - name: Save successful state
        uses: actions/upload-artifact@v4
        with:
          name: weekly-collector-state
          path: backend/data/weekly/state.json
          if-no-files-found: error
          retention-days: 90
      - name: Save review reports, including partial failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekly-review-report
          path: |
            backend/data/weekly/trials.generated.json
            backend/data/weekly/alerts.generated.md
          if-no-files-found: warn
          retention-days: 30
  release:
    needs: collect
    uses: ./.github/workflows/deploy.yml
    secrets:
      FIREBASE_SERVICE_ACCOUNT_TRYWISE_9F8E1: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRYWISE_9F8E1 }}
