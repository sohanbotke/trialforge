name: Deploy to Firebase Hosting

# Deploys the site to trywise-9f8e1.web.app on every push to main.
# The weekly collector commits refreshed candidates to backend/data/, and
# those commits flow through this workflow, so the live site picks up
# fresh radar finds automatically.
#
# Required repo secret: FIREBASE_SERVICE_ACCOUNT_TRYWISE_9F8E1
#   Firebase console -> Project settings -> Service accounts ->
#   Generate new private key -> paste the whole JSON as the secret value.

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRYWISE_9F8E1 }}
          channelId: live
          projectId: trywise-9f8e1
